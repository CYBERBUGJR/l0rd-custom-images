name: Build NetBox + plugins

on:
  push:
    branches:
      - main
    paths:
      - images/netbox/**
      - .github/workflows/build-netbox.yml
  workflow_dispatch:

env:
  # Immutable tag, pinned in gitops_l0rd.be/apps/infra/netbox/values.yaml.
  # Bump the suffix on every rebuild, then align values.yaml.
  IMAGE_TAG: v4.6.7-plugins-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 is emulated: the rasp cluster is arm64, amd64 is built too so the
      # image stays usable if NetBox ever moves to thor/yggdrasil.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/netbox
          file: images/netbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cyberbugjr/netbox:${{ env.IMAGE_TAG }}
